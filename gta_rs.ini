; gta-rs: activar (1) o desactivar (0) cada funcion reescrita.
; Si algo falla en el juego, pon a 0 la ultima funcion anadida y vuelve a probar.
; Las que no aparezcan aqui usan su valor por defecto.

[hooks]
CTimer::Update=1
CFileLoader::LoadLevel=1
CFileLoader::LoadObjectTypes=1
CFileLoader::LoadScene=1
CTimer::GetTimerQPC=1
CTimer::GetTimerRs=1
CTimer::Initialise=1
CTimer::Shutdown=1
CTimer::UpdateVariables=1
CTimer::Suspend=1
CTimer::Resume=1
CTimer::GetCyclesPerMillisecond=1
CTimer::GetCyclesPerFrame=1
CTimer::GetCurrentTimeInCycles=1
CTimer::Stop=1
CTimer::GetIsSlowMotionActive=1
CTimer::StartUserPause=1
CTimer::EndUserPause=1
